<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titleKey)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{__${titleKey}__} + ' | ' + #{app.name}">Dish Management</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<nav th:fragment="nav" class="navbar" aria-label="Main" th:attr="aria-label=#{nav.main}">
  <div class="container nav-inner">
    <a class="brand" th:href="@{/dishes}"><span class="brand-mark" aria-hidden="true">◒</span><span th:text="#{app.name}">Kitchen menu</span></a>
    <div class="nav-pages">
      <a th:href="@{/dishes}" th:text="#{nav.dishes}">Dishes</a>
      <a th:href="@{/categories}" th:text="#{nav.categories}">Categories</a>
    </div>
    <div class="languages" th:attr="aria-label=#{nav.language}">
      <a th:href="${languageLinks != null ? languageLinks['en'] : '?lang=en'}" lang="en" th:classappend="${#locale.language == 'en'} ? 'selected'" th:attr="aria-current=${#locale.language == 'en' ? 'true' : null}">English</a>
      <a th:href="${languageLinks != null ? languageLinks['vi'] : '?lang=vi'}" lang="vi" th:classappend="${#locale.language == 'vi'} ? 'selected'" th:attr="aria-current=${#locale.language == 'vi' ? 'true' : null}">Tiếng Việt</a>
    </div>
  </div>
</nav>
<div th:fragment="flash" aria-live="polite">
  <div th:if="${successKey != null}" class="alert alert-success" th:text="#{__${successKey}__}"></div>
  <div th:if="${errorKey != null}" class="alert alert-danger" role="alert" th:text="#{__${errorKey}__}"></div>
</div>
<footer th:fragment="footer" class="container footer"><span th:text="#{app.footer}">Dish management</span><span>BIT240038</span></footer>
</body></html>
