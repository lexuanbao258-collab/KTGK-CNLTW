<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head('dish.detail')}"></head>
<body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container">
  <header class="page-heading"><div><a class="back-link" th:href="@{/dishes}" th:text="#{action.back}"></a><h1 th:text="${dish.name}"></h1><p th:text="${dish.category.name}"></p></div><a class="btn btn-primary" th:href="@{/dishes/{id}/edit(id=${dish.id})}" th:text="#{action.edit}"></a></header>
  <div th:replace="~{fragments/layout :: flash}"></div>
  <section class="detail-summary"><dl><dt th:text="#{dish.price}"></dt><dd class="detail-price"><span th:text="${#numbers.formatDecimal(dish.price,1,'COMMA',2,'POINT')}"></span> VND</dd><dt th:text="#{dish.time}"></dt><dd><span th:text="${dish.preparationTime}"></span> <span th:text="#{unit.minute}"></span> · <span th:text="${dish.quick} ? #{time.quick} : #{time.regular}"></span></dd><dt th:text="#{dish.status}"></dt><dd><span class="status" th:classappend="${dish.available} ? 'selling' : 'stopped'" th:text="${dish.available} ? #{status.available} : #{status.unavailable}"></span></dd></dl><div><h2 th:text="#{dish.description}"></h2><p class="description" th:text="${#strings.isEmpty(dish.description)} ? #{dish.description.empty} : ${dish.description}"></p></div></section>
  <section class="images-section"><h2 th:text="#{image.title}"></h2><p class="empty-state" th:if="${#lists.isEmpty(dish.images)}" th:text="#{image.empty}"></p>
    <div class="image-grid"><figure class="image-card" th:each="image : ${dish.images}"><img th:src="${image.imageUrl}" th:alt="${dish.name}" loading="lazy" referrerpolicy="no-referrer"><figcaption><span th:if="${image.thumbnail}" class="status selling" th:text="#{image.thumbnail}"></span><form th:unless="${image.thumbnail}" method="post" th:action="@{/dishes/{id}/images/{imageId}/thumbnail(id=${dish.id},imageId=${image.id})}"><button class="btn btn-sm btn-outline-primary" th:text="#{image.choose}"></button></form></figcaption></figure></div>
  </section>
  <form class="editor-panel image-form" method="post" th:action="@{/dishes/{id}/images(id=${dish.id})}" th:object="${imageForm}" novalidate>
    <h2 th:text="#{image.add}"></h2><label for="imageUrl" th:text="#{image.url}"></label><input class="form-control" id="imageUrl" th:field="*{imageUrl}" type="url" placeholder="https://..." maxlength="2048" required aria-describedby="image-error"><div class="field-error" id="image-error" th:errors="*{imageUrl}"></div><div class="form-check my-3"><input class="form-check-input" id="thumbnail" type="checkbox" th:field="*{thumbnail}"><label class="form-check-label" for="thumbnail" th:text="#{image.set.thumbnail}"></label></div><button class="btn btn-primary" th:text="#{image.add}"></button>
  </form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
