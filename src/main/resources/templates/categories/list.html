<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/layout :: head('category.list.title')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container">
  <header class="page-heading"><div><h1 th:text="#{category.list.title}"></h1><p th:text="#{category.list.subtitle}"></p></div><a class="btn btn-primary" th:href="@{/categories/new}" th:text="#{category.create}"></a></header>
  <div th:replace="~{fragments/layout :: flash}"></div>
  <div class="table-panel table-responsive"><table class="table align-middle"><thead><tr><th scope="col" th:text="#{category.name}"></th><th scope="col" th:text="#{dish.description}"></th><th scope="col" th:text="#{action.title}"></th></tr></thead><tbody><tr th:each="category : ${categories}"><td class="dish-link" th:text="${category.name}"></td><td th:text="${category.description}"></td><td><div class="row-actions"><a class="btn btn-sm btn-outline-secondary" th:href="@{/categories/{id}/edit(id=${category.id})}" th:text="#{action.edit}"></a><form method="post" th:action="@{/categories/{id}/delete(id=${category.id})}" th:attr="data-confirm=#{confirm.category.delete}"><button class="btn btn-sm btn-outline-danger" th:text="#{action.delete}"></button></form></div></td></tr></tbody></table><p class="empty-state" th:if="${#lists.isEmpty(categories)}" th:text="#{category.empty}"></p></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
